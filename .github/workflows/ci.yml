name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: pip install pydataset && python3 -I scripts/make-real-data.py
      - run: npm run bench
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm i --no-save playwright && npm run e2e
